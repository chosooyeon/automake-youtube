name: 주식 매매 알림

# 맥이 꺼져 있어도 알림이 가도록 깃허브 러너가 대신 스캔한다.
# 판정은 확정된 일봉 기준이라 장 마감 후 하루 2번이면 충분하다.
on:
  schedule:
    # 06:50 UTC = 15:50 KST — 한국장 마감(15:30) 후
    - cron: "50 6 * * 1-5"
    # 21:30 UTC = 06:30 KST(익일) — 미국장 마감(16:00 ET) 후. 서머타임 유무 모두 커버
    - cron: "30 21 * * 1-5"
  # Actions 탭에서 손으로 실행 (연결 테스트용)
  workflow_dispatch:

# 알림 이력은 커밋하지 않고 Actions 캐시에 둔다 (아래 참고) — 저장소 쓰기 권한이 필요 없다
permissions:
  contents: read

# 두 스케줄이 겹쳐 돌면 같은 알림이 두 번 간다
concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 토큰이 없으면 스크립트가 2초 만에 죽는데, 로그를 열어보기 전엔 왜 죽었는지 안 보인다.
      # 2026-08-13 ~ 09-07 34회 연속 실패가 전부 이것이었다 — 실행 요약에 바로 뜨게 한다.
      - name: 텔레그램 시크릿 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::GitHub Secrets 에 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 가 없습니다. 저장소 Settings → Secrets and variables → Actions 에 추가하세요 (값은 admin/data/stock/telegram.json)."
            exit 1
          fi
          echo "시크릿 있음 ✓"

      # 알림 이력(어떤 종목에 어떤 신호를 이미 보냈나)은 실행 사이에 살아 있어야 한다.
      # 없으면 매 실행마다 살아 있는 신호를 전부 다시 보낸다 (관심종목 65개면 하루 두 번 20통).
      #
      # 왜 커밋이 아니라 캐시인가: 봇이 main 에 커밋하면 맥에서 push 할 때마다 rebase 가 필요하고,
      # 맥의 로컬 스캔도 같은 파일을 건드려 충돌이 난다. 캐시는 키가 실행마다 달라서 항상 새로 저장되고,
      # restore-keys 가 가장 최근 것을 되살린다. 캐시가 비면(7일 미사용) 체크아웃된 파일이 시작점이 된다 —
      # 그 파일은 사람이 마지막으로 커밋한 씨앗이라, 최악의 경우에도 씨앗 이후 신호만 한 번 더 온다.
      - name: 알림 이력 복원
        uses: actions/cache/restore@v4
        with:
          path: config/stock-alert-state.json
          key: stock-alert-state-${{ github.run_id }}
          restore-keys: |
            stock-alert-state-

      # npm ci 를 하지 않는 이유: 판정 로직은 node 내장 모듈(fs/path/fetch)만 쓴다.
      # admin 의존성(sharp·canvas·googleapis 등)은 이 작업에 전혀 필요 없고 설치만 오래 걸린다.
      # cwd 가 admin 이어야 하는 건 lib/paths.ts 의 REPO_ROOT 가 cwd 기준이기 때문.
      - name: 관심종목 스캔 + 알림 발송
        working-directory: admin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx --yes tsx@4.23.12 ../scripts/stock-scan-ci.ts

      # 스캔이 중간에 실패해도 이미 보낸 알림 기록은 남겨야 다음 실행에서 중복 발송을 막는다
      - name: 알림 이력 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: config/stock-alert-state.json
          key: stock-alert-state-${{ github.run_id }}
