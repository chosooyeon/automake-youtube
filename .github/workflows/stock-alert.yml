name: 주식 매매 알림

# 맥이 꺼져 있어도 알림이 가도록 깃허브 러너가 대신 스캔한다.
# 판정은 확정된 일봉 기준이라 장 마감 후 하루 2번이면 충분하다.
on:
  schedule:
    # 06:50 UTC = 15:50 KST — 한국장 마감(15:30) 후
    - cron: "50 6 * * 1-5"
    # 21:30 UTC = 06:30 KST(익일) — 미국장 마감(16:00 ET) 후. 서머타임 유무 모두 커버
    - cron: "30 21 * * 1-5"
  # Actions 탭에서 손으로 실행 (연결 테스트용)
  workflow_dispatch:

# 알림 이력 파일을 커밋해야 하므로 쓰기 권한이 필요하다
permissions:
  contents: write

# 두 스케줄이 겹쳐 돌면 알림 이력 커밋이 충돌한다
concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm ci 를 하지 않는 이유: 판정 로직은 node 내장 모듈(fs/path/fetch)만 쓴다.
      # admin 의존성(sharp·canvas·googleapis 등)은 이 작업에 전혀 필요 없고 설치만 오래 걸린다.
      # cwd 가 admin 이어야 하는 건 lib/paths.ts 의 REPO_ROOT 가 cwd 기준이기 때문.
      - name: 관심종목 스캔 + 알림 발송
        working-directory: admin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx --yes tsx@4.23.12 ../scripts/stock-scan-ci.ts

      - name: 알림 이력 저장
        # 스캔이 실패해도 이미 보낸 알림 기록은 남겨야 중복 발송을 막는다
        if: always()
        run: |
          if git diff --quiet -- config/stock-alert-state.json; then
            echo "변경 없음 — 새로 발송된 알림이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/stock-alert-state.json
          git commit -m "chore(stock): 알림 발송 이력 갱신"
          # 다른 커밋이 그사이 올라왔을 수 있다 — rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "::warning::알림 이력 push 실패 — 다음 실행에서 같은 알림이 한 번 더 갈 수 있습니다."
