name: 페이퍼 트레이딩

# 종이 위 가상매매 기록. **주문은 어디로도 나가지 않는다** — KIS 모의계좌와도 무관하다.
# 계산은 시작일부터 매번 재생(replay)하므로 러너에 아무것도 저장할 필요가 없다
# (그래서 stock-alert.yml 과 달리 커밋 단계가 없고 contents 는 read 면 충분하다).
on:
  schedule:
    # 06:50 UTC = 15:50 KST — 한국장 마감(15:30) 후
    - cron: "50 6 * * 1-5"
    # 21:35 UTC = 06:35 KST(익일) — 미국장 마감(16:00 ET) 후. 서머타임 유무 모두 커버
    - cron: "35 21 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "돌릴 시장"
        type: choice
        default: BOTH
        options: [BOTH, KR, US]
      notify:
        description: "텔레그램으로도 보낼까"
        type: boolean
        default: true

permissions:
  contents: read

# 같은 시장이 겹쳐 돌면 텔레그램이 두 번 온다
concurrency:
  group: paper-trade-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # 트랙이 늘면 100종목 재생도 그만큼 반복된다

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 스케줄이 둘인데 워크플로가 하나라서, 어느 크론이 깨웠는지로 갈라야 한다 —
      # 둘 다 매번 돌리면 장이 열리기도 전의 시장까지 계산하고 텔레그램도 배로 온다.
      #
      # 돌릴 것은 시장이 아니라 **트랙**이다. 한 시장에 규칙이 다른 트랙이 나란히 있고
      # (KR = 현재 설정, KR2 = 덜 판다), 둘을 같은 날 같은 종목으로 굴려야 비교가 성립한다.
      - name: 트랙 결정
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "50 6 * * 1-5")  echo "tracks=KR KR2" >> "$GITHUB_OUTPUT" ;;
            "35 21 * * 1-5") echo "tracks=US" >> "$GITHUB_OUTPUT" ;;
            *)
              # 손으로 실행한 경우 — 입력값을 따른다
              case "${{ inputs.market }}" in
                KR) echo "tracks=KR KR2" >> "$GITHUB_OUTPUT" ;;
                US) echo "tracks=US" >> "$GITHUB_OUTPUT" ;;
                *)  echo "tracks=KR KR2 US" >> "$GITHUB_OUTPUT" ;;
              esac
              ;;
          esac

      # npm ci 를 하지 않는 이유는 stock-alert.yml 과 같다: 이 경로는 node 내장 모듈
      # (fs/path/fetch)만 쓴다. cwd 가 admin 이어야 하는 것도 같은 이유 —
      # lib/paths.ts 의 REPO_ROOT 가 cwd 기준이다.
      - name: 가상매매 기록 + 알림
        working-directory: admin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.notify == false && '0' || '1' }}
        run: |
          set -euo pipefail
          fail=0
          for t in ${{ steps.pick.outputs.tracks }}; do
            echo "::group::$t"
            args="--track $t"
            [ "$NOTIFY" = "1" ] && args="$args --notify"
            # 매일 알림은 KR 하나만 받는다. 미국(US)과 비교군(KR2)은 실제 매매가 있는 날만.
            #
            # 트랙을 늘린 만큼 알림도 늘리면 하루 세 통이 되고, 그러면 숫자가 여러 벌이라
            # 나쁜 쪽을 만지고 싶어진다 — 그게 계약서를 건드려 검증을 죽인다.
            # 비교는 매일 할 일이 아니라 몇 주 뒤에 할 일이므로 화면(📝 페이퍼 탭)에서 본다.
            # 기록 자체는 계속 쌓인다 (페이퍼는 소급이 안 되므로 끊지 않는다).
            case "$t" in
              KR) ;;
              *) args="$args --trades-only" ;;
            esac
            # 한 트랙이 실패해도 나머지는 돌린다 — 네이버가 한쪽만 막히는 경우가 있다
            npx --yes tsx@4.23.12 ../scripts/paper-trade.ts $args || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # 계약서가 바뀌면 그때부터 다른 실험이다. 러너에서 조용히 바뀌는 일은 없어야 하지만,
      # 혹시 바뀌었다면 커밋하지 말고 경고만 남긴다 (커밋하면 사람 모르게 규칙이 갈린다).
      - name: 계약서 무결성 확인
        if: always()
        run: |
          if ! git diff --quiet -- config/paper-*.json; then
            echo "::error::페이퍼 계약서가 실행 중에 바뀌었습니다. 규칙이 갈리므로 확인이 필요합니다."
            git diff -- config/paper-*.json
            exit 1
          fi
          echo "계약서 변경 없음 ✓"
